# prod-2 HAProxy baseline — installed by ops/prod-2-host.sh base as
# /etc/haproxy/haproxy.cfg (validated with haproxy -c before the AMI
# is cut).
#
# evo-x2's shape, minus everything evo-x2-only: the stick-table rate
# rules WITHOUT the home-LAN whitelist (prod-2 serves the public
# internet only), the data-ui.map routing rule, no sinistercode
# vhosts, no 8080 Traefik hop, and NO default backend — an unknown
# host gets HAProxy's own 503, which is the Phase B gate's expected
# answer before any app exists. The tls bind loads
# /etc/haproxy/certs/ (a self-signed placeholder pem ships with the
# baseline; setup-tls.sh's lineage replaces it); the map starts
# empty. haproxy_bootstrap and setup-tls.sh are patchers on top of
# this baseline, never installers: the conf.d include (EXTRAOPTS in
# /etc/default/haproxy) and the map rule ship HERE so their greps
# find the work already done.

global
    log /dev/log local0 info notice
    log /dev/log local1 notice notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    maxconn 4096
    tune.ssl.default-dh-param 2048
    user haproxy
    group haproxy
    daemon

defaults
    log global
    mode http
    timeout connect 5000
    timeout client  50000
    timeout server  50000
    option http-server-close
    option httplog
    errorfile 400 /etc/haproxy/errors/400.http
    errorfile 403 /etc/haproxy/errors/403.http
    errorfile 408 /etc/haproxy/errors/408.http
    errorfile 500 /etc/haproxy/errors/500.http
    errorfile 502 /etc/haproxy/errors/502.http
    errorfile 503 /etc/haproxy/errors/503.http
    errorfile 504 /etc/haproxy/errors/504.http

frontend http
    bind *:80
    mode http
    option dontlognull
    http-request redirect scheme https code 301

frontend https
    bind *:443 ssl crt /etc/haproxy/certs/
    mode http
    option http-ignore-probes
    # Same rate posture as evo-x2, without its LAN whitelist:
    # prod-2 has no trusted clients.
    stick-table type ip size 200k expire 10m store http_req_rate(60s),conn_cur,conn_rate(60s)

    acl too_many_conns    sc_conn_cur(0)      gt 100
    acl high_conn_rate    sc_conn_rate(0)     gt 200      # per 60s
    acl too_many_requests sc_http_req_rate(0) gt 1000     # per 60s

    tcp-request connection track-sc0 src
    tcp-request connection reject if too_many_conns
    tcp-request connection reject if high_conn_rate
    http-request tarpit if too_many_requests
    http-request capture req.hdr(X-Forwarded-For) len 15
    http-request capture req.hdr(X-Real-IP) len 15
    acl mapped_dataui req.hdr(host),lower,map(/etc/haproxy/data-ui.map) -m found

    use_backend %[req.hdr(host),lower,map(/etc/haproxy/data-ui.map)] if { req.hdr(host),lower,map(/etc/haproxy/data-ui.map) -m found }
    # No default_backend: unknown hosts answer 503 (the pre-cutover
    # public view of an unpublished app).
